const dayOK = (iso) => Date.parse(`${iso}T19:00:00-04:00`) - Date.now() >= LEAD;
async function portalCall(qs, method, body) {
  const r = await fetch(`/api/pasta?r=portal&t=${encodeURIComponent(t)}${qs}`, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Não deu certo. Tente de novo.'); return d;
}
async function movePost(p, day) {
  CAL.pick = null;
  if (!day || day === p.day) { render(); return; }
  if (!p.can_move) { toast(p.group === 'publicado' ? 'Esse post já foi publicado.' : 'Esse post sai em menos de 48h e já está travado. Para mudar, fale com a agência em Pedidos.'); render(); return; }
  try { await portalCall('&move=1', 'POST', { id: p.id, day }); toast(`Mudou para ${dmy(day).slice(0, 5)}. A agência foi avisada.`); }
  catch (e) { toast(e.message); }
  loadCal(CAL.month);
}
function dragify(el, p) {
  el.classList.add('dragme');
  el.querySelectorAll('img').forEach((i) => { i.draggable = false; });
  el.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
    const mv = (ev) => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        ghost = h('div', { class: 'drag-ghost' }); ghost.append((el.querySelector('img, .sk') || el).cloneNode(true)); document.body.append(ghost);
      }
      ev.preventDefault();
      ghost.style.transform = `translate(${ev.clientX - 30}px, ${ev.clientY - 40}px)`;
      const tgt = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-day]');
      if (tgt !== over) { over?.classList.remove('drop'); over = tgt; over?.classList.add('drop'); }
      if (ev.clientY < 70) scrollBy(0, -14); else if (ev.clientY > innerHeight - 70) scrollBy(0, 14);
    };
    const up = () => {
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!ghost) return;
      ghost.remove(); over?.classList.remove('drop'); DRAG.until = Date.now() + 400;
      if (over) movePost(p, over.dataset.day);
    };
    addEventListener('pointermove', mv, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  return el;
}
function ideaForm(day) {
  const title = h('input', { type: 'text', maxlength: '120', placeholder: 'Ex.: lançamento da coleção nova' });
  const fmt = h('select', {}, ...Object.entries(FMT).map(([v, l]) => h('option', { value: v }, l)));
  const det = h('textarea', { maxlength: '1500', placeholder: 'Detalhes, referência ou o que não pode faltar (opcional)' });
  const err = h('div', { class: 'err', role: 'alert' });
  title.addEventListener('input', () => { err.textContent = ''; });
  const send = h('button', { class: 'btn primary sm', type: 'button', onclick: async () => {
    if (title.value.trim().length < 3) { err.textContent = 'Escreva a ideia primeiro.'; title.focus(); return; }
    send.disabled = true;
    try { await portalCall('&idea=1', 'POST', { day, title: title.value, media_type: fmt.value, details: det.value }); CAL.form = null; toast('Ideia enviada. A agência vai ver e responder.'); loadCal(CAL.month); }
    catch (e) { err.textContent = e.message; send.disabled = false; }
  } }, 'Enviar ideia');
  setTimeout(() => title.focus(), 0);
  return h('div', { class: 'idea-form' }, h('b', {}, `Sugerir ideia para ${dmy(day).slice(0, 5)}`),
    title, h('label', { class: 'muted', style: 'display:grid;gap:4px;font-size:13px' }, 'Formato', fmt), det, err,
    h('div', { style: 'display:flex;gap:8px' }, send, h('button', { class: 'btn sm', type: 'button', onclick: () => { CAL.form = null; render(); } }, 'Cancelar')),
    h('span', { class: 'muted', style: 'font-size:12.5px' }, 'A sugestão entra como ideia: não conta no seu plano, e você pode apagar enquanto a agência não começar a produzir.'));
}
async function removeIdea(p) {
  try { await portalCall(`&idea=${encodeURIComponent(p.id)}`, 'DELETE'); toast('Ideia apagada.'); } catch (e) { toast(e.message); }
  loadCal(CAL.month);
}

function calendarPanel(panel) {
  if (!CAL.month) { loadCal(todayISO().slice(0, 7)); panel.append(h('div', { class: 'empty' }, 'Carregando o calendário…')); return; }
  const posts = CAL.data?.posts || [];
  const byDay = {}; for (const p of posts) (byDay[p.day] ||= []).push(p);
  const [y, m] = CAL.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const today = todayISO();
  const edit = Boolean(CAL.data?.editable);
  panel.append(h('div', { class: 'cal-head' },
    h('button', { class: 'cal-nav', type: 'button', 'aria-label': 'Mês anterior', onclick: () => loadCal(shiftMonth(CAL.month, -1)) }, '‹'),
    h('b', {}, monthName(CAL.month)),
    h('button', { class: 'cal-nav', type: 'button', 'aria-label': 'Próximo mês', onclick: () => loadCal(shiftMonth(CAL.month, 1)) }, '›')));
  if (CAL.loading) { panel.append(h('div', { class: 'empty' }, 'Carregando…')); return; }
  if (edit) panel.append(CAL.pick
    ? h('div', { class: 'edit-hint', role: 'status' }, h('span', {}, 'Toque no novo dia para ', h('b', {}, `“${CAL.pick.title || FMT[CAL.pick.media_type] || 'Post'}”`)), h('button', { class: 'btn sm', type: 'button', style: 'margin-left:auto', onclick: () => { CAL.pick = null; render(); } }, 'Cancelar'))
    : h('div', { class: 'edit-hint' }, h('span', {}, h('b', {}, 'Você pode reorganizar: '), 'arraste um post para outro dia, ou toque num dia livre para sugerir uma ideia. Posts travam 48h antes de sair.')));
  const grid = h('div', { class: 'cal' }, ...WD.map((w) => h('div', { class: 'wd' }, w)));
  for (let i = 0; i < first; i++) grid.append(h('div', { class: 'd out', 'aria-hidden': 'true' }));
  for (let d = 1; d <= days; d++) {
    const iso = `${CAL.month}-${String(d).padStart(2, '0')}`;
    const list = byDay[iso] || [];
    grid.append(h('button', { type: 'button', class: `d${iso === today ? ' today' : ''}${CAL.pick ? ' picking' : ''}`, 'aria-pressed': String(CAL.day === iso), 'data-day': edit ? iso : null,
      'aria-label': `${d} de ${monthName(CAL.month).toLowerCase()}: ${list.length ? `${list.length} post(s)` : 'sem posts'}`,
      onclick: () => { if (Date.now() < DRAG.until) return; if (CAL.pick) { movePost(CAL.pick, iso); return; } CAL.form = null; CAL.day = CAL.day === iso ? null : iso; render(); } },
      h('span', { class: 'n' }, String(d)),
      // capa do 1º post do dia (quando a arte já foi mostrada ao cliente) + quantos posts tem
      list.length ? (() => { const cv = (edit && list.find((p) => p.can_move)) || list.find((p) => p.image_url) || list[0];
        const el = h('span', { class: `cv g-${cv.group}` },
          cv.image_url ? h('img', { src: cv.image_url, alt: '', loading: 'lazy' }) : sketchCover(cv, 'in-cal'),
          list.length > 1 ? h('span', { class: 'cv-n' }, `+${list.length - 1}`) : null);
        return edit && cv.can_move ? dragify(el, cv) : el; })() : null,
      list.length ? h('span', { class: 'dots' }, ...list.map((p) => h('span', { class: `dot g-${p.group}`, title: `${p.time} · ${FMT[p.media_type] || 'Post'} · ${GROUP[p.group]}` }))) : null));
  }
  panel.append(grid,
    h('div', { class: 'cal-legend' }, ...Object.entries(GROUP).filter(([k]) => k !== 'sugestao' || posts.some((p) => p.group === 'sugestao')).map(([k, l]) => h('span', {}, h('span', { class: `dot g-${k}`, style: 'width:8px;height:8px;border-radius:50%;display:inline-block' }), l))));
  const shown = CAL.day ? (byDay[CAL.day] || []) : posts;
  if (CAL.day) panel.append(h('div', { class: 'cal-day' }, `${dmy(CAL.day)} · ${shown.length ? `${shown.length} post(s)` : 'nenhum post neste dia'}`));
  if (edit && CAL.day && !CAL.pick) {
    if (CAL.form === CAL.day) panel.append(ideaForm(CAL.day));
    else if (dayOK(CAL.day)) panel.append(h('button', { class: 'btn sm', type: 'button', style: 'justify-self:start', onclick: () => { CAL.form = CAL.day; render(); } }, `＋ Sugerir ideia para ${dmy(CAL.day).slice(0, 5)}`));
    else if (CAL.day >= today) panel.append(h('div', { class: 'muted', style: 'font-size:13px' }, 'Para sugerir ideia, escolha um dia a partir de 48h daqui.'));
  }
  else if (!posts.length) panel.append(h('div', { class: 'empty' }, 'Nenhum post programado neste mês ainda.'));
  let lastDay = null;
  for (const p of shown) {
    if (!CAL.day && p.day !== lastDay) { panel.append(h('div', { class: 'cal-day' }, `${WD[new Date(`${p.day}T12:00:00Z`).getUTCDay()]}, ${dmy(p.day).slice(0, 5)}`)); lastDay = p.day; }
    const thumb = p.image_url ? h('img', { class: 'thumb', src: p.image_url, alt: '', loading: 'lazy' }) : sketchCover({ ...p, title: '' }, 'thumb in-list');
    const main = p.group === 'aprovar' || p.group === 'roteiro' ? h('a', { class: 'btn primary sm', href: D.approval.url }, 'Aprovar')
      : p.permalink ? h('a', { class: 'btn sm', href: p.permalink, target: '_blank', rel: 'noopener' }, 'Ver post')
      : h('span', { class: `pill ${p.group === 'publicado' || p.group === 'programado' ? 'paid' : p.group === 'ajuste' ? 'late' : p.group === 'sugestao' ? 'open' : 'waived'}` }, GROUP[p.group]);
    const acts = edit ? h('div', { class: 'acts' }, main,
      p.can_move ? h('button', { class: 'btn sm', type: 'button', onclick: () => { CAL.pick = p; CAL.form = null; scrollTo({ top: 0, behavior: 'smooth' }); render(); } }, 'Mudar dia') : null,
      p.mine ? h('button', { class: 'btn sm', type: 'button', onclick: (e) => { if (e.currentTarget.dataset.ok) removeIdea(p); else { e.currentTarget.dataset.ok = '1'; e.currentTarget.textContent = 'Confirmar apagar'; } } }, 'Apagar') : null) : main;
    panel.append(h('div', { class: 'cpost' },
      edit && p.can_move ? dragify(h('span', {}, thumb), p) : thumb,
      h('div', {}, h('div', { class: 't' }, p.title || FMT[p.media_type] || 'Post'), h('div', { class: 's' }, `${p.time} · ${FMT[p.media_type] || 'Post'}`),
        edit && !p.can_move && p.group !== 'publicado' ? h('div', { class: 'lockt' }, '🔒 Travado: sai em menos de 48h') : null),
      acts));
  }
}

    }

    if (!(D.history || []).length) panel.append(h('div', { class: 'empty' }, 'Os registros aparecem aqui a partir dos próximos envios.'));

// Comprovante: arquivo da pasta ou recibo do Pix automático
function receiptLink(p, label) {
  if (p.receipt_id) return h('a', { class: 'btn sm', href: fileUrl(p.receipt_id), target: '_blank', rel: 'noopener', title: 'Comprovante' }, label);
  if (p.receipt_url) return h('a', { class: 'btn sm', href: p.receipt_url, target: '_blank', rel: 'noopener', title: 'Comprovante do Pix' }, label);
  return null;
}
// Pagar com Pix (cobrança exclusiva da parcela; a baixa é automática)
function payButton(m, p) {
  if (!D.pix_enabled || !['open', 'late'].includes(p.status)) return null;
  return h('button', { class: 'btn primary sm', type: 'button', onclick: async (e) => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Gerando Pix…';
    try {
      const r = await fetch(`/api/pasta?r=portal&t=${encodeURIComponent(t)}&pix=1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ month: m.month, n: p.n }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Não foi possível gerar o Pix.');
      const sheet = h('div', { class: 'pix-sheet', role: 'dialog', 'aria-label': 'Pagar com Pix' },
        h('div', { class: 'pix-card' },
          h('div', { class: 'eyebrow' }, d.label),
          h('div', { class: 'big' }, brl(d.value_cents)),
          d.image ? h('img', { src: d.image, alt: 'QR Code do Pix', class: 'pix-qr' }) : null,
          h('span', { class: 'muted', style: 'font-size:13px' }, 'Abra o app do banco, escolha Pix → Copia e cola (ou leia o QR Code).'),
          h('div', { class: 'pix' }, h('code', {}, d.payload), h('button', { class: 'btn sm', onclick: async () => { try { await navigator.clipboard.writeText(d.payload); toast('Código Pix copiado.'); } catch { toast('Selecione e copie o código.'); } } }, 'Copiar')),
          h('span', { class: 'muted', style: 'font-size:12.5px' }, 'Depois de pagar, a baixa aparece aqui sozinha em instantes. Não precisa mandar comprovante.'),
          h('button', { class: 'btn', onclick: () => sheet.remove() }, 'Fechar')));
      sheet.addEventListener('click', (ev) => { if (ev.target === sheet) sheet.remove(); });
      document.body.append(sheet);
    } catch (x) { toast(x.message); }
    btn.disabled = false; btn.textContent = 'Pagar com Pix';
  } }, 'Pagar com Pix');
}

// Novo pedido: texto, data desejada e até 5 anexos (fotos/PDF/vídeo curto até 4 MB cada)
function requestForm() {
  const text = h('textarea', { id: 'rq-text', rows: 4, placeholder: 'Ex.: Promoção de banho e tosa no sábado, 20% de desconto. Seguem fotos da loja.' });
  const date = h('input', { type: 'date', id: 'rq-date' });
  const files = h('input', { type: 'file', id: 'rq-files', multiple: true, accept: 'image/*,video/mp4,video/quicktime,.pdf,.heic' });
  const btn = h('button', { class: 'btn primary', type: 'submit' }, 'Enviar pedido');
  const status = h('span', { class: 'muted', style: 'font-size:13px' });
  return h('form', { class: 'card', onsubmit: async (ev) => {
    ev.preventDefault();
    if (text.value.trim().length < 3) return toast('Escreva o que você precisa.');
    btn.disabled = true;
    try {
      const ids = [];
      for (const [i, f] of [...files.files].slice(0, 5).entries()) {
        if (f.size > 4 * 1024 * 1024) throw new Error(`"${f.name}" passa de 4 MB. Vídeos maiores, mande pelo WhatsApp.`);
        status.textContent = `Enviando anexo ${i + 1}…`;
        const r = await fetch(`/api/pasta?r=portal&t=${encodeURIComponent(t)}&upload=1`, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'x-file-name': encodeURIComponent(f.name) }, body: f });
        const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Falha ao enviar anexo.');
        ids.push(d.id);
      }
      const r = await fetch(`/api/pasta?r=portal&t=${encodeURIComponent(t)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text.value, wanted_date: date.value || null, file_ids: ids }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Não foi possível enviar.');
      D.requests = [{ ...d, files: ids.map((id) => ({ id })) }, ...(D.requests || [])];
      toast('Pedido enviado para a agência!'); render();
    } catch (e) { toast(e.message); btn.disabled = false; status.textContent = ''; }
  } },
    h('div', { class: 'eyebrow' }, 'Novo pedido'),
    h('label', { for: 'rq-text', style: 'font-weight:700;font-size:14px' }, 'O que você precisa?'), text,
    h('div', { class: 'row2' },
      h('label', { for: 'rq-date', style: 'font-size:13px' }, 'Para quando? (opcional)', date),
      h('label', { for: 'rq-files', style: 'font-size:13px' }, 'Fotos ou arquivos (opcional)', files)),
    h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, btn, status));
}

try {
  if (!t) throw new Error('Link incompleto. Peça o seu link para a agência.');
  const r = await fetch(`/api/pasta?r=portal&t=${encodeURIComponent(t)}`);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Não foi possível abrir.');
  D = data; render();
} catch (e) {
  $app.replaceChildren(h('p', { class: 'msg' }, e.message));
}
</script>
