<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório de desempenho</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
  :root {
    --bg: #EBEBE6; --surface: #fff; --surface-2: #F2F2ED; --ink: #2B2B2B; --muted: #6B6A63; --line: #D9D8CF;
    --accent: #2B2B2B; --accent-soft: #E4E1D3; --up: #17703F; --up-bg: #E2F4E9; --down: #B4232F; --down-bg: #FBE3E5;
    --gold: #B07A00; --display: "Poppins", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .bar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .02em; }
  .brand-mark { background: var(--ink); color: #fff; border-radius: 7px; padding: 3px 6px; font-size: 13px; }
  .spacer { flex: 1; }
  .btn { font: inherit; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  header.hero { padding: 36px 0 8px; display: grid; gap: 6px; }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -.01em; }
  .who { font-size: 16px; color: var(--muted); }
  .who b { color: var(--ink); }
  .partial { margin-top: 8px; background: #FCF1D9; color: #3b2a00; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  section { margin-top: 28px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; }
  .kpi.hl { background: var(--ink); color: #fff; border-color: var(--ink); }
  .kpi.hl .lbl, .kpi.hl .sub { color: #B7BDC8; }
  .kpi .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .kpi .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05; }
  .kpi .sub { font-size: 12.5px; color: var(--muted); }
  .delta { justify-self: start; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--up); background: var(--up-bg); }
  .delta.down { color: var(--down); background: var(--down-bg); }
  .delta.flat { color: var(--muted); background: var(--surface-2); }
  .kpi.hl .delta.up { background: rgba(109,211,154,.16); color: #6DD39A; }
  .kpi.hl .delta.down { background: rgba(255,124,134,.16); color: #FF9AA2; }
  .top { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .tp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
  .tp-img { position: relative; aspect-ratio: 4 / 5; background: var(--surface-2); }
  .tp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tp-img .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 16px; text-align: center; }
  .rank { position: absolute; left: 10px; top: 10px; background: var(--ink); color: #fff; font-weight: 800; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .rank.r1 { background: var(--gold); }
  .tp-body { padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start; }
  .tp-meta { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tp-cap { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .nums div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-size: 11.5px; color: var(--muted); }
  .nums b { display: block; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
  .tp a.link { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
  .fmt-list { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .fmt-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 230px; gap: 14px; align-items: center; }
  .fmt-name b { display: block; } .fmt-name span, .fmt-num span { color: var(--muted); font-size: 13px; }
  .fmt-bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; } .fmt-bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .fmt-num { font-size: 14px; }
  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .slot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
  .slot b { font-size: 18px; } .slot span { color: var(--muted); font-size: 13px; }
  .slot.first { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .steps { margin: 0; padding: 16px 18px 16px 40px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; display: grid; gap: 10px; font-size: 15px; line-height: 1.55; }
  @media (max-width: 640px) { .fmt-row { grid-template-columns: 1fr; gap: 6px; } .slots { grid-template-columns: 1fr; } }
  .note { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 16px 18px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  .tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { font-size: 11.5px; font-family: var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  td.cap { white-space: normal; max-width: 280px; color: var(--muted); }
  td.cap a { color: inherit; }
  tr:last-child td { border-bottom: 0; }
  tr.is-top td:first-child::after { content: " ★"; color: var(--gold); }
  .glossary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; font-size: 13px; color: var(--muted); line-height: 1.45; }
  .glossary b { color: var(--ink); }
  .warn { font-size: 13px; color: var(--muted); }
  footer { margin: 36px 0 48px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .msg { text-align: center; padding: 80px 16px; color: var(--muted); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .top { grid-template-columns: minmax(0, 1fr); } .tp { grid-template-columns: 120px minmax(0, 1fr); grid-template-rows: none; } .tp-img { aspect-ratio: auto; min-height: 150px; } .glossary { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 420px) { .kpi .val { font-size: 24px; } .kpi { padding: 12px; } }
  @page { size: A4; margin: 14mm 12mm; }
  @media print {
    body { background: #fff; font-size: 12px; }
    .bar, .noprint { display: none !important; }
    header.hero { padding-top: 0; }
    section { margin-top: 18px; break-inside: avoid; }
    section.allposts { break-inside: auto; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .top { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp { grid-template-columns: none; grid-template-rows: auto 1fr; }
    .tp-img { aspect-ratio: 4 / 5; }
    .kpi, .tp, .tablewrap, .note { box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table { min-width: 0; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <div class="brand"><span class="brand-mark">MC</span><span>DIGITAL</span></div>
  <span class="spacer"></span>
  <button class="btn primary" id="pdf" type="button" hidden>Baixar PDF</button>
</div></div>
<main class="wrap" id="app"><p class="msg">Carregando o relatório…</p></main>
<script type="module">
// replaceChildren ignorando null/false (evita aparecer o texto "null" na tela)
if (!Element.prototype.__mcSafe) { const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...k) { return rc.apply(this, k.flat().filter((x) => x != null && x !== false)); }; Element.prototype.__mcSafe = true; }
const $app = document.getElementById('app');
const t = new URLSearchParams(location.search).get('t');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const monthName = (ym) => { const [y, m] = ym.split('-').map(Number); return `${cap(MESES[m - 1])} de ${y}`; };
const nf = new Intl.NumberFormat('pt-BR');
const fmt = (v) => (v == null ? '—' : nf.format(v));
const day = (iso) => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'America/Cuiaba' }).format(new Date(iso));

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'html') el.innerHTML = v; else el.setAttribute(k, v); }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
function delta(cur, prev, isPct = false) {
  if (cur == null || prev == null) return null;
  if (isPct) { const d = +(cur - prev).toFixed(2); return h('span', { class: `delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}`, title: 'Comparado ao mês anterior' }, `${d > 0 ? '▲' : d < 0 ? '▼' : '='} ${nf.format(Math.abs(d))} p.p.`); }
  if (prev === 0) return cur > 0 ? h('span', { class: 'delta up', title: 'Comparado ao mês anterior' }, '▲ novo') : null;
  const p = Math.round(((cur - prev) / Math.abs(prev)) * 100);
  return h('span', { class: `delta ${p > 0 ? 'up' : p < 0 ? 'down' : 'flat'}`, title: 'Comparado ao mês anterior' }, `${p > 0 ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)}%`);
}

function render({ ref_month, data: d, note, updated_at }) {
  const T = d.totals || {}, P = d.previous || {};
  const title = `${monthName(ref_month)}`;
  document.title = `Relatório ${d.client_name} - ${title}`; // nome do arquivo ao salvar em PDF
  const kpi = (label, value, sub, dl, hl) => h('div', { class: `kpi${hl ? ' hl' : ''}` }, h('div', { class: 'lbl' }, label), h('div', { class: 'val' }, value), dl, sub ? h('div', { class: 'sub' }, sub) : null);
  const fg = T.followers_gained;
  const kpis = h('div', { class: 'kpis' },
    kpi('Alcance', fmt(T.reach?.value), T.reach?.source === 'posts' ? 'soma dos posts do mês' : 'contas alcançadas', delta(T.reach?.value, P.reach), true),
    kpi('Curtidas', fmt(T.likes?.value), null, delta(T.likes?.value, P.likes)),
    kpi('Comentários', fmt(T.comments?.value), null, delta(T.comments?.value, P.comments)),
    kpi('Salvamentos', fmt(T.saves?.value), null, delta(T.saves?.value, P.saves)),
    kpi('Compartilhamentos', fmt(T.shares?.value), null, delta(T.shares?.value, P.shares)),
    kpi('Seguidores ganhos', fg ? `${fg.value > 0 ? '+' : ''}${fmt(fg.value)}` : '—',
      fg?.lost != null ? `${fmt(fg.new)} novos · ${fmt(fg.lost)} deixaram de seguir` : T.followers?.value != null ? `${fmt(T.followers.value)} seguidores no total` : null, fg ? delta(fg.value, P.followers_gained) : null),
    kpi('Posts publicados', fmt(T.posts?.value), null, delta(T.posts?.value, P.posts)),
    kpi('Taxa de engajamento', T.engagement ? `${nf.format(T.engagement.value)}%` : '—', 'interações ÷ alcance', delta(T.engagement?.value, P.engagement, true)));

  const byId = new Map((d.posts || []).map((p) => [p.id, p]));
  const top = (d.top || []).map((id) => byId.get(id)).filter(Boolean);
  const topCards = top.length ? h('div', { class: 'top' }, ...top.map((p, i) => h('article', { class: 'tp' },
    h('div', { class: 'tp-img' }, p.image ? h('img', { src: p.image, alt: `Post de ${day(p.timestamp)}`, loading: 'lazy' }) : h('div', { class: 'noimg' }, p.type),
      h('span', { class: `rank r${i + 1}` }, `${i + 1}º`)),
    h('div', { class: 'tp-body' },
      h('div', { class: 'tp-meta' }, `${day(p.timestamp)} · ${p.type}`),
      p.caption ? h('div', { class: 'tp-cap' }, p.caption) : null,
      h('div', { class: 'nums' },
        h('div', {}, h('b', {}, fmt(p.reach)), 'alcance'),
        h('div', {}, h('b', {}, fmt(p.likes)), 'curtidas'),
        h('div', {}, h('b', {}, fmt(p.comments)), 'coment.'),
        h('div', {}, h('b', {}, fmt(p.saved)), 'salvam.'),
        h('div', {}, h('b', {}, fmt(p.shares)), 'compart.'),
        h('div', {}, h('b', {}, fmt(p.interactions)), 'interações')),
      p.permalink ? h('a', { class: 'link noprint', href: p.permalink, target: '_blank', rel: 'noopener' }, 'Ver no Instagram ↗') : null))))
    : h('div', { class: 'empty' }, 'Nenhum post publicado neste mês.');

  const topSet = new Set(d.top || []);
  const table = (d.posts || []).length ? h('div', { class: 'tablewrap' }, h('table', {},
    h('thead', {}, h('tr', {}, ...['Data', 'Tipo', 'Post', 'Alcance', 'Curtidas', 'Coment.', 'Salvam.', 'Compart.'].map((x) => h('th', { scope: 'col' }, x)))),
    h('tbody', {}, ...d.posts.map((p) => h('tr', { class: topSet.has(p.id) ? 'is-top' : null },
      h('td', {}, day(p.timestamp)), h('td', {}, p.type),
      h('td', { class: 'cap' }, p.permalink ? h('a', { href: p.permalink, target: '_blank', rel: 'noopener' }, (p.caption || 'Ver post').slice(0, 70)) : (p.caption || '').slice(0, 70)),
      h('td', {}, fmt(p.reach)), h('td', {}, fmt(p.likes)), h('td', {}, fmt(p.comments)), h('td', {}, fmt(p.saved)), h('td', {}, fmt(p.shares)))))))
    : null;

  // Desempenho por formato (só aparece com 2+ formatos no mês)
  const F = d.formats || [];
  const maxI = Math.max(1, ...F.map((x) => x.avg_interactions));
  const formats = F.length >= 2 ? h('div', { class: 'fmt-list' }, ...F.map((x) => h('div', { class: 'fmt-row' },
    h('div', { class: 'fmt-name' }, h('b', {}, x.type), h('span', {}, `${x.posts} post${x.posts > 1 ? 's' : ''}`)),
    h('div', { class: 'fmt-bar' }, h('span', { style: `width:${Math.round((x.avg_interactions / maxI) * 100)}%` })),
    h('div', { class: 'fmt-num' }, h('b', {}, fmt(x.avg_interactions)), ' interações/post', x.avg_reach != null ? h('span', {}, ` · ${fmt(x.avg_reach)} de alcance`) : null))))
    : null;
  // Melhores horários
  const BT = d.best_times;
  const times = BT?.slots?.length ? h('div', { class: 'times' },
    h('div', { class: 'slots' }, ...BT.slots.map((s, i) => h('div', { class: `slot${i === 0 ? ' first' : ''}` }, h('b', {}, s.label.replace(/^(\S+)/, (w) => ({ dom: 'Domingo', seg: 'Segunda', ter: 'Terça', qua: 'Quarta', qui: 'Quinta', sex: 'Sexta', 'sáb': 'Sábado' }[w] || w))),
      s.lift ? h('span', {}, `${nf.format(s.lift)}× o engajamento normal`) : h('span', {}, 'sugestão inicial')))),
    h('p', { class: 'warn' }, BT.source === 'perfil'
      ? `Calculado com ${BT.based_on} posts do perfil nos últimos 4 meses: compara curtidas e comentários de cada post com a média do perfil, por dia da semana e hora (horário de Cuiabá).`
      : 'Ainda há poucos posts para calcular os horários deste perfil. Estes são pontos de partida: a ideia é testar e comparar nos próximos meses.')) : null;
  const steps = (d.next_steps_custom || d.next_steps || []);
  const stepsBox = steps.length ? h('ol', { class: 'steps' }, ...steps.map((s) => h('li', {}, s))) : null;

  $app.replaceChildren(
    h('header', { class: 'hero' },
      h('div', { class: 'eyebrow' }, 'Relatório de desempenho · Instagram'),
      h('h1', {}, title),
      h('div', { class: 'who' }, h('b', {}, d.client_name), d.ig_username ? ` · @${d.ig_username}` : ''),
      d.period?.partial ? h('div', { class: 'partial' }, `Mês em andamento: dados até ${day(d.period.end)}. Os números finais saem no começo do mês seguinte.`) : null),
    h('section', {}, h('h2', {}, 'Resumo do mês'), kpis,
      d.previous ? h('p', { class: 'warn' }, 'As setas comparam com o mês anterior.') : null),
    h('section', {}, h('h2', {}, 'Melhores posts do mês'), topCards),
    formats ? h('section', {}, h('h2', {}, 'Desempenho por formato'), formats) : null,
    times ? h('section', {}, h('h2', {}, 'Melhores horários para postar'), times) : null,
    stepsBox ? h('section', { class: 'next' }, h('h2', {}, 'Próximos passos'), stepsBox) : null,
    note ? h('section', {}, h('h2', {}, 'Comentários da agência'), h('div', { class: 'note' }, note)) : null,
    table ? h('section', { class: 'allposts' }, h('h2', {}, 'Todos os posts do mês'), table) : null,
    h('section', {}, h('h2', {}, 'Como ler'),
      h('div', { class: 'glossary' },
        h('div', {}, h('b', {}, 'Alcance: '), 'quantas contas diferentes viram o conteúdo.'),
        h('div', {}, h('b', {}, 'Salvamentos: '), 'quem guardou o post para ver depois — sinal forte de valor.'),
        h('div', {}, h('b', {}, 'Compartilhamentos: '), 'quantas vezes o post foi enviado para outras pessoas.'),
        h('div', {}, h('b', {}, 'Taxa de engajamento: '), 'curtidas + comentários + salvamentos + compartilhamentos, dividido pelo alcance.'),
        h('div', {}, h('b', {}, 'Melhores posts: '), 'os 3 posts do mês com mais interações.'),
        h('div', {}, h('b', {}, 'Fonte: '), 'dados oficiais do Instagram. Podem variar um pouco em relação ao aplicativo.')),
      ...(d.warnings || []).map((w) => h('p', { class: 'warn' }, w))),
    h('footer', {}, h('span', {}, 'Preparado por ', h('b', {}, 'MC DIGITAL')), h('span', { class: 'spacer' }),
      h('span', {}, `Atualizado em ${new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Cuiaba' }).format(new Date(updated_at || d.generated_at))}`)));
  const b = document.getElementById('pdf'); b.hidden = false; b.onclick = () => window.print();
}

try {
  if (!t) throw new Error('Link incompleto. Peça o link do relatório para a agência.');
  const r = await fetch(`/api/pasta?r=report&t=${encodeURIComponent(t)}`);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Não foi possível abrir o relatório.');
  render(data);
} catch (e) {
  $app.replaceChildren(h('p', { class: 'msg' }, e.message));
}
</script>
</body>
</html>
