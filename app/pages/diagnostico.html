<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&family=Yellowtail&display=swap">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
  :root { --bg: #ECEAE7; --ink: #1D1A1A; --muted: #5F5955; --gold: #7B1F31; --line: #DDD8D3; --card: #FFFFFF;
    --head: "Montserrat", Georgia, serif; --body: "Montserrat", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16.5px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--head); font-weight: 600; margin: 0; line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 70px; display: grid; gap: 26px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { width: 76px; }
  .eyebrow { color: var(--gold); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 600; }
  .hero h1 { font-size: clamp(40px, 7.4vw, 66px); margin: 8px 0 14px; }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .card h3 { font-size: 27px; }
  .hero p { font-size: clamp(16px, 2.2vw, 19px); color: #45443f; margin: 0; max-width: 56ch; }
  .perks { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 14.5px; color: var(--muted); }
  .perks span::before { content: "✓ "; color: var(--gold); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 4vw, 34px); display: grid; gap: 20px; box-shadow: 0 20px 50px rgba(43,43,43,.08); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .f { display: grid; gap: 8px; }
  .f > label, .f > .l { font-weight: 600; font-size: 15.5px; }
  .f .opt-l { color: var(--muted); font-weight: 400; font-size: 13px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(122,98,0,.14); }
  .at { position: relative; } .at span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; } .at input { padding-left: 32px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 14.5px; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
  .consent input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); flex: none; }
  .btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; font-size: 16.5px; padding: 15px 26px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; gap: 8px; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .hp { position: absolute; left: -5000px; }
  .steps { display: grid; gap: 8px; }
  .steps-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
  .prog { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .prog span { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .3s; }
  .step-title { font-size: clamp(28px, 5vw, 38px); }
  .nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .nav .btn { flex: 1 1 auto; }
  .back { background: none; border: none; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 10px 4px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 14.5px; font-weight: 600; }
  details.more[open] { display: grid; gap: 16px; }
  details.more[open] summary { margin-bottom: 4px; }
  .wait { text-align: center; padding: 50px 10px; display: grid; gap: 16px; justify-items: center; }
  .spin { width: 48px; height: 48px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--gold); animation: s .9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .res-head { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  .ring { width: 132px; height: 132px; }
  .ring text { font-family: var(--head); font-weight: 600; }
  .res-head h2 { font-size: clamp(22px, 3.6vw, 30px); }
  .badge { display: inline-block; font-size: 12.5px; font-weight: 600; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-top: 8px; color: var(--muted); }
  .nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .num { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .num b { display: block; font-family: var(--head); font-size: 28px; font-weight: 600; }
  .num span { font-size: 12.5px; color: var(--muted); }
  .area { display: grid; gap: 6px; }
  .area-top { display: flex; justify-content: space-between; font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 99px; }
  .area p { margin: 0; font-size: 14.5px; color: #45443f; }
  ul.str { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
  ul.str li::before { content: "★ "; color: var(--gold); }
  ol.act { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: a; }
  ol.act li { counter-increment: a; display: grid; grid-template-columns: 36px 1fr; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  ol.act li::before { content: counter(a); width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; }
  ol.act b { display: block; } ol.act span { font-size: 14.5px; color: #45443f; }
  .cta-box { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 26px; display: grid; gap: 14px; text-align: center; justify-items: center; }
  .cta-box .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .foot { text-align: center; font-size: 12.5px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #8E1B26; color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 50; max-width: calc(100vw - 32px); }
  @media (max-width: 600px) { .row2 { grid-template-columns: 1fr; } .nums { grid-template-columns: 1fr 1fr; } .res-head { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
</style>

<main class="wrap" id="dg"><p>Carregando…</p></main>
<script type="module">
import { h, api } from '/shared.js';
const $ = document.getElementById('dg');
let C;
const A = { formatos: [] };
const toast = (m) => { document.querySelector('.toast')?.remove(); const t = h('div', { class: 'toast', role: 'alert' }, m); document.body.append(t); setTimeout(() => t.remove(), 6000); };
const NICHOS = ['Saúde', 'Odontologia', 'Estética e beleza', 'Moda', 'Alimentação', 'Pet', 'Fitness', 'Educação', 'Imobiliário', 'Jurídico', 'Contabilidade', 'Automotivo', 'Varejo/loja', 'Serviços', 'Outro'];
const CHIPS = {
  objetivo: ['Vender mais', 'Atrair clientes da minha região', 'Ser referência no meu mercado', 'Crescer seguidores', 'Lançar um produto/serviço'],
  seguidores: ['Até 1 mil', '1 a 5 mil', '5 a 20 mil', '20 a 100 mil', 'Mais de 100 mil'],
  frequencia: ['Quase nunca', '1 vez por semana', '2 a 3 vezes por semana', '4 ou mais por semana', 'Todo dia'],
  quem_faz: ['Eu mesmo(a)', 'Alguém da equipe', 'Agência ou freelancer', 'Ninguém no momento'],
};

init();
async function init() {
  try { C = await api('/api/pasta?r=diagnostico'); } catch { C = { enabled: false }; }
  if (!C.enabled || !C.ai) return $.replaceChildren(header(), h('div', { class: 'card' }, h('h2', {}, 'Diagnóstico indisponível no momento'), h('p', {}, 'Volte mais tarde ou fale com a gente pelo Instagram @mcdigital.ag.')));
  form();
}
function header() { return h('div', { class: 'top' }, h('img', { src: '/brand/logo.png', alt: 'MC Digital' }), h('span', { class: 'eyebrow' }, 'Grátis · 2 minutos')); }
function chips(key, multi = false) {
  const box = h('div', { class: 'chips', role: multi ? 'group' : 'radiogroup' });
  const opts = key === 'formatos' ? ['Fotos', 'Carrossel', 'Reels', 'Stories'] : CHIPS[key];
  const draw = () => box.replaceChildren(...opts.map((o) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(multi ? A[key].includes(o) : A[key] === o),
    onclick: () => { if (multi) A[key] = A[key].includes(o) ? A[key].filter((x) => x !== o) : [...A[key], o]; else A[key] = o; draw(); } }, o)));
  draw(); return box;
}
// Formulário em 3 passos: o @ primeiro (compromisso pequeno), depois as perguntas em toque, e o contato por último.
const V = { handle: '', nicho: '', name: '', wa: '', company: '', email: '', dif: '', hp: '', consent: false };
let step = 1;
const QS = [['objetivo', 'Qual o seu principal objetivo com o Instagram?'], ['seguidores', 'Quantos seguidores, mais ou menos?'], ['frequencia', 'Com que frequência você posta?'], ['quem_faz', 'Quem cuida do Instagram hoje?']];
function form() {
  const f = (label, el, opt) => h('div', { class: 'f' }, h('label', { for: el.id }, label, opt ? h('span', { class: 'opt-l' }, ' (opcional)') : null), el);
  const fc = (label, el, opt) => h('div', { class: 'f' }, h('div', { class: 'l' }, label, opt ? h('span', { class: 'opt-l' }, ' (opcional)') : null), el);
  const bind = (el, k) => { el.value = V[k]; el.addEventListener('input', () => { V[k] = el.value; }); el.addEventListener('change', () => { V[k] = el.value; }); return el; };
  const progress = h('div', { class: 'steps' }, h('div', { class: 'steps-top' }, h('span', {}, `Passo ${step} de 3`), h('span', {}, ['Seu perfil', 'Seu Instagram hoje', 'Seu resultado'][step - 1])),
    h('div', { class: 'prog' }, h('span', { style: `width:${Math.round((step / 3) * 100)}%` })));
  const back = step > 1 ? h('button', { type: 'button', class: 'back', onclick: () => { step -= 1; form(); } }, '← Voltar') : h('span');
  let body, next, label;
  if (step === 1) {
    const handle = bind(h('input', { id: 'd-ig', placeholder: 'seuperfil', autocapitalize: 'none', autocomplete: 'off', inputmode: 'text', maxlength: 60 }), 'handle');
    const nicho = bind(h('select', { id: 'd-ni' }, h('option', { value: '' }, 'Escolha…'), ...NICHOS.map((n) => h('option', { value: n, selected: V.nicho === n }, n))), 'nicho');
    body = [h('div', { class: 'f' }, h('label', { for: 'd-ig' }, 'Qual é o @ do seu Instagram?'), h('div', { class: 'at' }, h('span', {}, '@'), handle)), f('Qual o segmento do seu negócio?', nicho)];
    label = 'Continuar →';
    next = () => { if (!V.handle.trim()) return toast('Digite o @ do seu Instagram.'); if (!V.nicho) return toast('Escolha o segmento do seu negócio.'); return true; };
    setTimeout(() => handle.focus(), 50);
  } else if (step === 2) {
    body = [...QS.map(([k, q]) => fc(q, chips(k))), fc('Quais formatos você mais usa?', chips('formatos', true), true)];
    label = 'Continuar →';
    next = () => { const miss = QS.find(([k]) => !A[k]); return miss ? toast(`Responda: ${miss[1]}`) : true; };
  } else {
    const name = bind(h('input', { id: 'd-name', autocomplete: 'name', maxlength: 120 }), 'name');
    const wa = bind(h('input', { id: 'd-wa', type: 'tel', inputmode: 'tel', autocomplete: 'tel', placeholder: '(65) 99999-9999' }), 'wa');
    const company = bind(h('input', { id: 'd-co', maxlength: 120 }), 'company');
    const email = bind(h('input', { id: 'd-em', type: 'email', autocomplete: 'email' }), 'email');
    const dif = bind(h('textarea', { id: 'd-dif', placeholder: 'Ex.: não sei o que postar, posto e ninguém interage, não tenho tempo…', maxlength: 400 }), 'dif');
    const hp = bind(h('input', { class: 'hp', name: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' }), 'hp');
    const consent = h('input', { type: 'checkbox', id: 'd-ok', checked: V.consent, onchange: () => { V.consent = consent.checked; } });
    body = [h('div', { class: 'row2' }, f('Seu nome', name), f('WhatsApp', wa)),
      h('details', { class: 'more' }, h('summary', {}, 'Quer contar mais? (opcional)'), h('div', { class: 'row2' }, f('Nome da empresa', company, true), f('E-mail', email, true)), f('Qual a sua maior dificuldade com o Instagram?', dif, true)),
      hp, h('label', { class: 'consent', for: 'd-ok' }, consent, h('span', {}, 'Aceito receber o resultado e o contato da MC Digital pelo WhatsApp. Seus dados não são compartilhados.'))];
    label = 'Ver meu diagnóstico →';
    next = () => {
      if (!V.name.trim()) return toast('Digite o seu nome.');
      if (V.wa.replace(/\D/g, '').length < 10) return toast('Digite o seu WhatsApp com DDD.');
      if (!V.consent) return toast('Marque que aceita receber o resultado e o contato pelo WhatsApp.');
      return true;
    };
    setTimeout(() => name.focus(), 50);
  }
  const go = h('button', { class: 'btn', type: 'submit' }, label);
  const hero = step === 1 ? h('section', { class: 'hero' }, h('div', { class: 'eyebrow' }, 'Diagnóstico gratuito'), h('h1', {}, C.headline),
    h('p', {}, 'Três passos rápidos e você recebe, na hora, a nota do seu perfil, o que já está funcionando e as 3 ações que mais vão fazer diferença agora.'),
    h('div', { class: 'perks' }, h('span', {}, 'Na hora'), h('span', {}, 'Sem custo'), h('span', {}, 'Feito para o seu negócio'))) : null;
  $.replaceChildren(header(), hero,
    h('form', { class: 'card', onsubmit: async (e) => {
      e.preventDefault();
      if (next() !== true) return;
      if (step < 3) { step += 1; form(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      go.disabled = true;
      waiting();
      try {
        const r = await api('/api/pasta?r=diagnostico', { method: 'POST', body: { handle: V.handle, name: V.name, whatsapp: V.wa, company: V.company, email: V.email, website: V.hp,
          answers: { nicho: V.nicho, objetivo: A.objetivo, seguidores: A.seguidores, frequencia: A.frequencia, formatos: A.formatos, quem_faz: A.quem_faz, dificuldade: V.dif } } });
        result(r, V.handle.replace(/^@/, ''), V.name);
      } catch (err) { form(); toast(err.message); }
    } }, progress, step > 1 ? h('h2', { class: 'step-title' }, step === 2 ? `Como está o @${V.handle.replace(/^@/, '')} hoje?` : 'Para onde mandamos o seu resultado?') : null, ...body, h('div', { class: 'nav' }, back, go)),
    h('p', { class: 'foot' }, 'Usamos só informações públicas do perfil e as suas respostas.'));
}
function waiting() {
  const msg = h('p', {}, 'Lendo o seu perfil…');
  const steps = ['Lendo o seu perfil…', 'Olhando constância e formatos…', 'Avaliando bio, conteúdo e engajamento…', 'Montando as suas 3 ações…'];
  let i = 0; const t = setInterval(() => { i = Math.min(i + 1, steps.length - 1); msg.textContent = steps[i]; }, 3500);
  $.replaceChildren(header(), h('div', { class: 'card wait' }, h('div', { class: 'spin', 'aria-hidden': 'true' }), h('h2', {}, 'Analisando…'), msg));
  $.dataset.t = t;
}
const color = (s) => (s >= 70 ? '#2E7D4F' : s >= 45 ? '#7B1F31' : '#B4232F');
function ring(score) {
  const ns = 'http://www.w3.org/2000/svg'; const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 120 120'); svg.setAttribute('class', 'ring'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', `Nota ${score} de 100`);
  const c = (r, st, dash) => { const e = document.createElementNS(ns, 'circle'); e.setAttribute('cx', 60); e.setAttribute('cy', 60); e.setAttribute('r', r); e.setAttribute('fill', 'none'); e.setAttribute('stroke', st); e.setAttribute('stroke-width', 11); if (dash) { e.setAttribute('stroke-dasharray', dash); e.setAttribute('transform', 'rotate(-90 60 60)'); e.setAttribute('stroke-linecap', 'round'); } return e; };
  const L = 2 * Math.PI * 50;
  svg.append(c(50, '#DDD8D3'), c(50, color(score), `${(score / 100) * L} ${L}`));
  const t = document.createElementNS(ns, 'text'); t.setAttribute('x', 60); t.setAttribute('y', 68); t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', 34); t.setAttribute('fill', '#1D1A1A'); t.textContent = score;
  svg.append(t); return svg;
}
function result(r, handle, name) {
  clearInterval(Number($.dataset.t));
  const R = r.result, P = R.profile;
  const nf = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR'));
  const want = h('button', { class: 'btn', type: 'button', onclick: async () => {
    want.disabled = true;
    try { await api('/api/pasta?r=diagnostico&want=1', { method: 'POST', body: { id: r.id, key: r.key } }); } catch { /* segue para o WhatsApp mesmo assim */ }
    if (r.whatsapp) location.href = `https://wa.me/${r.whatsapp}?text=${encodeURIComponent(`Oi! Sou ${name.split(' ')[0]}, fiz o diagnóstico do @${handle} (nota ${R.score}/100) e quero conversar sobre o meu Instagram.`)}`;
    else { want.textContent = 'Recebemos! Vamos te chamar no WhatsApp ✓'; }
  } }, r.cta || 'Quero ajuda da MC Digital');
  $.replaceChildren(header(),
    h('section', { class: 'card' },
      h('div', { class: 'res-head' }, ring(R.score), h('div', {}, h('div', { class: 'eyebrow' }, `Diagnóstico de @${handle}`), h('h2', {}, R.headline || 'Seu diagnóstico'),
        h('span', { class: 'badge' }, P ? 'Com dados públicos reais do perfil' : 'Com base nas suas respostas'))),
      P ? h('div', { class: 'nums' }, h('div', { class: 'num' }, h('b', {}, nf(P.followers)), h('span', {}, 'seguidores')), h('div', { class: 'num' }, h('b', {}, P.posts_per_week ?? '—'), h('span', {}, 'posts por semana')),
        h('div', { class: 'num' }, h('b', {}, nf(P.avg_interactions)), h('span', {}, 'interações por post')), h('div', { class: 'num' }, h('b', {}, P.engagement_rate != null ? `${String(P.engagement_rate).replace('.', ',')}%` : '—'), h('span', {}, 'engajamento'))) : null,
      ...R.areas.map((a) => h('div', { class: 'area' }, h('div', { class: 'area-top' }, h('span', {}, a.name), h('span', { style: `color:${color(a.score)}` }, `${a.score}/100`)),
        h('div', { class: 'bar' }, h('span', { style: `width:${a.score}%;background:${color(a.score)}` })), h('p', {}, a.comment)))),
    R.strengths.length ? h('section', { class: 'card' }, h('h3', {}, 'O que já está bom'), h('ul', { class: 'str' }, ...R.strengths.map((s) => h('li', {}, s)))) : null,
    h('section', { class: 'card' }, h('h3', {}, 'Suas 3 ações para as próximas 2 semanas'), h('ol', { class: 'act' }, ...R.actions.map((a) => h('li', {}, h('div', {}, h('b', {}, a.title), h('span', {}, a.detail)))))),
    h('section', { class: 'cta-box' }, h('h2', { style: 'font-size:26px' }, 'Quer que a gente coloque isso em prática?'), h('p', { style: 'margin:0;opacity:.85' }, R.closing || 'A MC Digital cuida do planejamento, da criação e da publicação para você.'), want),
    h('p', { class: 'foot' }, 'Análise gerada com inteligência artificial a partir de dados públicos e das suas respostas. Não é garantia de resultado.'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
