<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  /* Padrão visual @frasesdefunkwow — card de frase 4:5 (1080×1350) */
  :root {
    --bg: #0B0B0F;
    --ink: #F5F3EE;
    --accent: #C6FF3D;   /* verde-neon: destaque da frase */
    --muted: #8A8A93;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); }
  .card {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    padding: 120px 96px; display: flex; flex-direction: column; justify-content: center;
    background:
      radial-gradient(900px 700px at 85% 10%, rgba(198,255,61,.10), transparent 60%),
      radial-gradient(700px 600px at 0% 100%, rgba(255,46,136,.08), transparent 60%),
      var(--bg);
    font-family: "Inter Display", "Inter", sans-serif;
  }
  /* grão sutil para tirar o aspecto "digital chapado" */
  .card::after {
    content: ""; position: absolute; inset: 0; opacity: .07; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .tag {
    font-weight: 700; font-size: 30px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 56px; display: flex; align-items: center; gap: 20px;
  }
  .tag::before { content: ""; width: 64px; height: 6px; background: var(--accent); }
  .frase {
    font-weight: 900; font-size: var(--size, 150px); line-height: .98; letter-spacing: -.035em;
    text-transform: uppercase; color: var(--ink);
  }
  .frase em { font-style: normal; color: var(--accent); display: block; }
  .rodape {
    position: absolute; left: 96px; right: 96px; bottom: 96px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; font-weight: 600; color: var(--muted);
  }
  .rodape b { color: var(--ink); font-weight: 800; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">{{TAG}}</div>
    <div class="frase" style="--size: {{SIZE}}px">{{FRASE}}</div>
    <div class="rodape"><b>@frasesdefunkwow</b><span>salva e manda pro parça →</span></div>
  </div>
</body>
</html>
